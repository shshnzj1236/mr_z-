<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr 𝓩 - Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            purple: '#a855f7',
                            blue: '#3b82f6',
                            cyan: '#06b6d4',
                            dark: '#05070f',
                            card: 'rgba(15, 23, 42, 0.75)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        /* 玻璃擬態面板 */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 20px rgba(168, 85, 247, 0.15);
        }

        /* 背景星雲懸浮動畫 */
        .nebula-bg {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.45;
            animation: floatNebula 12s ease-in-out infinite alternate;
        }

        @keyframes floatNebula {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -40px) scale(1.15); }
            100% { transform: translate(-20px, 30px) scale(0.95); }
        }

        /* 頭像霓虹光圈旋轉動畫 */
        .avatar-glow {
            position: relative;
        }
        .avatar-glow::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 1.25rem;
            background: linear-gradient(45deg, #a855f7, #3b82f6, #06b6d4, #a855f7);
            background-size: 300% 300%;
            z-index: -1;
            animation: glowRotate 6s linear infinite;
            filter: blur(8px);
            opacity: 0.85;
        }

        @keyframes glowRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* STATUS 霓虹呼吸燈動畫 */
        .status-glow-tag {
            animation: statusPulse 2s infinite alternate ease-in-out;
        }

        @keyframes statusPulse {
            0% {
                box-shadow: 0 0 4px rgba(168, 85, 247, 0.3);
                border-color: rgba(168, 85, 247, 0.3);
                background-color: rgba(168, 85, 247, 0.1);
            }
            100% {
                box-shadow: 0 0 12px rgba(168, 85, 247, 0.8), 0 0 20px rgba(168, 85, 247, 0.4);
                border-color: rgba(192, 132, 252, 0.8);
                background-color: rgba(168, 85, 247, 0.25);
            }
        }

        /* 按鈕流光特效 */
        .btn-shimmer {
            position: relative;
            overflow: hidden;
        }
        .btn-shimmer::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                60deg,
                transparent 30%,
                rgba(255, 255, 255, 0.15) 50%,
                transparent 70%
            );
            transform: rotate(30deg);
            animation: shimmerMove 4s infinite;
        }

        @keyframes shimmerMove {
            0% { transform: translate(-100%, -100%) rotate(30deg); }
            100% { transform: translate(100%, 100%) rotate(30deg); }
        }

        /* 打字機游標閃爍 */
        .cursor-blink {
            display: inline-block;
            width: 8px;
            height: 1em;
            background-color: #a855f7;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 堆疊卡片樣式 */
        .stack-container {
            position: relative;
            perspective: 1000px;
        }

        .stack-card {
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            transform-style: preserve-3d;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .stack-card.pos-0 {
            transform: translateZ(0px) translateY(0px) rotate(0deg);
            z-index: 30;
            opacity: 1;
        }

        .stack-card.pos-1 {
            transform: translateZ(-40px) translateY(18px) translateX(25px) rotate(3deg);
            z-index: 20;
            opacity: 0.85;
        }

        .stack-card.pos-2 {
            transform: translateZ(-80px) translateY(36px) translateX(50px) rotate(6deg);
            z-index: 10;
            opacity: 0.65;
        }

        /* 社交圖示懸浮 Glow */
        .social-icon-glow {
            transition: all 0.3s ease;
        }
        .social-icon-glow:hover {
            filter: drop-shadow(0 0 8px currentColor);
            transform: translateY(-2px);
        }

        /* Toast 複製提示 */
        #toast {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative p-4 md:p-8 select-none">

    <!-- 背景閃電與光點 Canvas -->
    <canvas id="lightningCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <!-- 背景星雲暈光 -->
    <div class="nebula-bg bg-purple-600 w-96 h-96 top-10 left-10 z-0"></div>
    <div class="nebula-bg bg-blue-600 w-96 h-96 bottom-10 right-10 z-0" style="animation-delay: -6s;"></div>

    <!-- 主卡片區域 -->
    <main class="relative z-10 w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">

        <!-- 左側：個人資料卡片 (佔 5 欄) -->
        <section class="lg:col-span-5 glass-panel rounded-3xl p-6 md:p-8 relative overflow-hidden transform hover:-translate-y-1 transition-all duration-300">
            
            <!-- 個人頭像與標題區塊 -->
            <div class="flex items-center space-x-5 mb-6">
                <!-- 霓虹頭像框 -->
                <div class="relative avatar-glow flex-shrink-0">
                    <img id="userAvatar" src="https://cdn.discordapp.com/attachments/1014411791981346866/1556150201859833907/IMG_7063.jpg?backend=b2&ex=6ac31d4f&is=6ac1cbcf&hm=2123e6889177c99dcfe9688103b52c14b5bff990ea450484d130b89f75275571&" 
                         alt="Mr 𝓩 Avatar" 
                         class="w-20 h-20 md:w-22 md:h-22 object-cover rounded-2xl border border-white/20">
                    <!-- 在線狀態指示點 -->
                    <span class="absolute -bottom-1 -right-1 w-5 h-5 bg-emerald-500 border-2 border-slate-900 rounded-full flex items-center justify-center">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    </span>
                </div>

                <!-- 名字與動態頭銜 -->
                <div>
                    <h1 class="text-3xl font-extrabold text-white tracking-wide flex items-center gap-2">
                        Mr 𝓩
                    </h1>
                    <!-- 打字機動態稱號 -->
                    <p class="text-xs font-mono text-purple-400 mt-1">
                        <span id="typingText"></span><span class="cursor-blink"></span>
                    </p>
                </div>
            </div>

            <!-- ABOUT ME (具備紫色霓虹漸層發光與動態打字效果) -->
            <div class="mb-6">
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2 flex items-center gap-2">
                    <i class="fa-solid font-bold fa-user text-purple-400"></i> ABOUT ME:
                </h2>
                <p class="text-sm font-medium leading-relaxed text-transparent bg-clip-text bg-gradient-to-r from-purple-300 via-fuchsia-300 to-indigo-300 drop-shadow-[0_0_10px_rgba(168,85,247,0.5)]">
                    <span id="aboutMeText"></span><span class="cursor-blink"></span>
                </p>
            </div>

            <!-- 聯絡方式區塊 (CONTACT INFORMATION) -->
            <div class="mb-6 space-y-3">
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-address-card text-blue-400"></i> CONTACT INFORMATION:
                </h2>

                <!-- Discord 點擊複製按鈕 (shshnzj1236) -->
                <div onclick="copyDiscord()" class="btn-shimmer flex items-center justify-between p-3.5 rounded-xl bg-slate-800/60 border border-white/10 hover:border-purple-500/50 hover:bg-slate-800/90 transition-all cursor-pointer group">
                    <div class="flex items-center space-x-3">
                        <i class="fa-brands fa-discord text-xl text-indigo-400 group-hover:scale-110 transition-transform"></i>
                        <span class="text-sm font-medium text-gray-200">Discord: <strong class="text-white">shshnzj1236</strong></span>
                    </div>
                    <i class="fa-regular fa-copy text-gray-400 group-hover:text-purple-400 transition-colors"></i>
                </div>

                <!-- Join My Server 按鈕 -->
                <a href="#" target="_blank" class="btn-shimmer flex items-center justify-between p-3.5 rounded-xl bg-emerald-950/40 border border-emerald-500/30 hover:border-emerald-400 hover:bg-emerald-900/40 transition-all text-emerald-400 font-medium group">
                    <div class="flex items-center space-x-3">
                        <i class="fa-solid fa-server text-emerald-400 group-hover:rotate-12 transition-transform"></i>
                        <span class="text-sm">Join my server</span>
                    </div>
                    <i class="fa-solid fa-arrow-right text-xs group-hover:translate-x-1 transition-transform"></i>
                </a>
            </div>

            <!-- 自訂備註、STATUS 與社交圖示區塊 -->
            <div class="p-4 rounded-2xl bg-slate-900/60 border border-white/5 space-y-3">
                <div class="flex justify-between items-center text-xs text-gray-400">
                    <span class="font-mono">blablabla</span>
                    <span class="status-glow-tag text-purple-300 px-2.5 py-0.5 rounded text-[10px] font-semibold border transition-all">STATUS</span>
                </div>
                <!-- STATUS 動態切換文字 -->
                <p class="text-xs text-purple-300/80 italic font-mono flex items-center gap-1">
                    <span id="statusMessage">nothing..........</span><span class="cursor-blink opacity-75"></span>
                </p>

                <!-- 社交平台連結列 -->
                <div class="pt-2 border-t border-white/5 flex items-center justify-center space-x-6 text-gray-400 text-lg">
                    <a href="#" class="social-icon-glow hover:text-red-500"><i class="fa-brands fa-youtube"></i></a>
                    <a href="#" class="social-icon-glow hover:text-green-400"><i class="fa-brands fa-spotify"></i></a>
                    <a href="#" class="social-icon-glow hover:text-white"><i class="fa-brands fa-github"></i></a>
                    <a href="#" class="social-icon-glow hover:text-indigo-400"><i class="fa-brands fa-discord"></i></a>
                </div>
            </div>

        </section>

        <!-- 右側：影片輪播區塊 (佔 7 欄) -->
        <section class="lg:col-span-7 flex flex-col items-center justify-center relative mt-4 lg:mt-0">
            
            <!-- 影片堆疊容器 -->
            <div class="stack-container w-full max-w-lg h-[340px] md:h-[420px] flex items-center justify-center">
                
                <!-- 卡片 0 (最上層) -->
                <div id="card0" class="stack-card pos-0 absolute w-full h-full rounded-2xl overflow-hidden border border-white/15 bg-slate-900">
                    <video id="video0" class="w-full h-full object-cover" autoplay loop muted playsinline></video>
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent flex items-end p-6 pointer-events-none">
                        <p class="text-white text-sm font-medium tracking-wide flex items-center gap-2">
                            <i class="fa-solid fa-video text-purple-400"></i> <span id="caption0">Video Preview</span>
                        </p>
                    </div>
                </div>

                <!-- 卡片 1 (第二層) -->
                <div id="card1" class="stack-card pos-1 absolute w-full h-full rounded-2xl overflow-hidden border border-white/10 bg-slate-900">
                    <video id="video1" class="w-full h-full object-cover" autoplay loop muted playsinline></video>
                </div>

                <!-- 卡片 2 (第三層) -->
                <div id="card2" class="stack-card pos-2 absolute w-full h-full rounded-2xl overflow-hidden border border-white/5 bg-slate-900">
                    <video id="video2" class="w-full h-full object-cover" autoplay loop muted playsinline></video>
                </div>

            </div>

            <!-- 控制按鈕與指示燈 -->
            <div class="flex items-center space-x-6 mt-8 z-20">
                <button onclick="prevSlide()" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-white hover:bg-purple-600 transition-all active:scale-95">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <div id="dots" class="flex space-x-2"></div>
                <button onclick="nextSlide()" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-white hover:bg-purple-600 transition-all active:scale-95">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

        </section>

    </main>

    <!-- Toast 複製成功提示 -->
    <div id="toast" class="fixed bottom-6 right-6 bg-purple-600 text-white px-5 py-3 rounded-xl shadow-2xl opacity-0 translate-y-4 pointer-events-none z-50 flex items-center gap-3">
        <i class="fa-solid fa-circle-check"></i>
        <span>Discord ID (shshnzj1236) 已複製！</span>
    </div>

    <!-- JavaScript 腳本區塊 -->
    <script>
        // ==========================================
        // 1. 影片輪播設定 (包含您的 Discord MP4 影片)
        // ==========================================
        const galleryVideos = [
            {
                src: 'https://cdn.discordapp.com/attachments/1014411791981346866/1556156858044256307/video.mp4?ex=6ac32382&is=6ac1d202&hm=b3ebd07cea89e7ae389a2028fe7b4cfee12741573728affd82bb119c4122af1f&',
                title: 'Featured Showcase Video'
            },
            {
                src: 'https://assets.mixkit.co/videos/preview/mixkit-car-driving-on-a-road-at-sunset-17367-large.mp4',
                title: 'Sunset Driving Shot'
            },
            {
                src: 'https://assets.mixkit.co/videos/preview/mixkit-top-view-of-a-sports-car-driving-on-a-curved-road-41551-large.mp4',
                title: 'Aerial Car Cinematic'
            }
        ];

        let currentIndex = 0;

        function updateGallery() {
            const total = galleryVideos.length;
            for (let i = 0; i < 3; i++) {
                const videoEl = document.getElementById(`video${i}`);
                const videoIndex = (currentIndex + i) % total;
                const videoData = galleryVideos[videoIndex];

                if (videoEl.src !== videoData.src) {
                    videoEl.src = videoData.src;
                    videoEl.load();
                    videoEl.play().catch(() => {});
                }

                if (i === 0) {
                    document.getElementById('caption0').textContent = videoData.title;
                }
            }

            // 更新指示燈
            const dotsContainer = document.getElementById('dots');
            dotsContainer.innerHTML = '';
            galleryVideos.forEach((_, idx) => {
                const dot = document.createElement('div');
                dot.className = `w-2.5 h-2.5 rounded-full transition-all duration-300 ${idx === currentIndex ? 'bg-purple-500 w-6' : 'bg-white/30'}`;
                dotsContainer.appendChild(dot);
            });
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % galleryVideos.length;
            updateGallery();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + galleryVideos.length) % galleryVideos.length;
            updateGallery();
        }

        updateGallery();

        // ==========================================
        // 2. ABOUT ME 區塊動態打字效果
        // ==========================================
        const aboutMePhrase = "I'm really into FiveM, car photography, and technical platform customization. Always crafting immersive visuals and exploring new digital aesthetics.";
        let aboutMeCharIdx = 0;
        const aboutMeEl = document.getElementById('aboutMeText');

        function typeAboutMe() {
            if (aboutMeCharIdx < aboutMePhrase.length) {
                aboutMeEl.textContent += aboutMePhrase.charAt(aboutMeCharIdx);
                aboutMeCharIdx++;
                setTimeout(typeAboutMe, 30);
            }
        }
        typeAboutMe();

        // 稱號動態打字機效果
        const typingPhrases = ["Developer & Photographer", "FiveM Customizer", "Car Photography Enthusiast"];
        let phraseIdx = 0;
        let charIdx = 0;
        let isDeleting = false;
        const typingEl = document.getElementById('typingText');

        function typeLoop() {
            const currentPhrase = typingPhrases[phraseIdx];
            if (isDeleting) {
                typingEl.textContent = currentPhrase.substring(0, charIdx - 1);
                charIdx--;
            } else {
                typingEl.textContent = currentPhrase.substring(0, charIdx + 1);
                charIdx++;
            }

            let typeSpeed = isDeleting ? 40 : 80;

            if (!isDeleting && charIdx === currentPhrase.length) {
                typeSpeed = 2000;
                isDeleting = true;
            } else if (isDeleting && charIdx === 0) {
                isDeleting = false;
                phraseIdx = (phraseIdx + 1) % typingPhrases.length;
                typeSpeed = 500;
            }

            setTimeout(typeLoop, typeSpeed);
        }
        typeLoop();

        // STATUS 動態切換文字
        const statusPhrases = [
            "nothing..........",
            "Coding FiveM scripts...",
            "Editing vehicle shots 📸",
            "Online on Discord 💬"
        ];

        let statusIdx = 0;
        let statusCharIdx = 0;
        let isStatusDeleting = false;
        const statusEl = document.getElementById('statusMessage');

        function statusTypeLoop() {
            const currentStatus = statusPhrases[statusIdx];
            if (isStatusDeleting) {
                statusEl.textContent = currentStatus.substring(0, statusCharIdx - 1);
                statusCharIdx--;
            } else {
                statusEl.textContent = currentStatus.substring(0, statusCharIdx + 1);
                statusCharIdx++;
            }

            let speed = isStatusDeleting ? 30 : 70;

            if (!isStatusDeleting && statusCharIdx === currentStatus.length) {
                speed = 2500;
                isStatusDeleting = true;
            } else if (isStatusDeleting && statusCharIdx === 0) {
                isStatusDeleting = false;
                statusIdx = (statusIdx + 1) % statusPhrases.length;
                speed = 400;
            }

            setTimeout(statusTypeLoop, speed);
        }
        statusTypeLoop();

        // 複製 Discord 名稱 (shshnzj1236)
        function copyDiscord() {
            navigator.clipboard.writeText("shshnzj1236");
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
            }, 2500);
        }

        // ==========================================
        // 3. Canvas 背景閃電與光點特效
        // ==========================================
        const canvas = document.getElementById('lightningCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = Array.from({ length: 45 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 0.5,
            speedY: Math.random() * 0.5 + 0.1,
            opacity: Math.random()
        }));

        let lightning = [];
        function createLightning() {
            const startX = canvas.width / 2 + (Math.random() - 0.5) * 400;
            let currentX = startX;
            let currentY = 0;
            const segments = [];

            while (currentY < canvas.height) {
                const nextX = currentX + (Math.random() - 0.5) * 50;
                const nextY = currentY + Math.random() * 30 + 10;
                segments.push({ x1: currentX, y1: currentY, x2: nextX, y2: nextY });
                currentX = nextX;
                currentY = nextY;
            }
            return { segments, opacity: 1 };
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.y -= p.speedY;
                if (p.y < 0) p.y = canvas.height;
                ctx.fillStyle = `rgba(168, 85, 247, ${p.opacity})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            if (Math.random() < 0.015 && lightning.length === 0) {
                lightning.push(createLightning());
            }

            lightning.forEach((l, index) => {
                ctx.strokeStyle = `rgba(147, 197, 253, ${l.opacity})`;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#3b82f6';
                ctx.beginPath();
                l.segments.forEach(s => {
                    ctx.moveTo(s.x1, s.y1);
                    ctx.lineTo(s.x2, s.y2);
                });
                ctx.stroke();
                l.opacity -= 0.05;
                if (l.opacity <= 0) lightning.splice(index, 1);
            });

            requestAnimationFrame(animateCanvas);
        }

        animateCanvas();
    </script>
</body>
</html>
